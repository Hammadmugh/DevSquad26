<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christian Muñoz - Product Designer</title>
    <link rel="stylesheet" href="./src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@700&family=Gotham:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Gotham";
        src: url("https://fonts.googleapis.com/css2?family=Work+Sans:wght@400&display=swap");
      }

      @import url("https://fonts.googleapis.com/css2?family=Anton&display=swap");

      .text-gradient {
        background: linear-gradient(90deg, #fa709a 0%, #fee140 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .font-anton {
        font-family: "Anton", sans-serif;
        font-weight: 400;
      }

      .font-gotham {
        font-family: "Gotham", sans-serif;
        font-weight: 400;
      }

      .theme-toggle-circle {
        transition: transform 0.3s ease;
      }

      .theme-toggle:active .theme-toggle-circle {
        transform: translateX(24px);
      }
    </style>
  </head>
  <body class="bg-black text-white">
    <!-- Main Container -->
    <div class="max-w-[1400px] mx-auto flex flex-col">
      <!-- NAVBAR -->
      <nav class="w-full flex justify-between items-center px-10 py-8">
        <!-- Logo -->
        <img id="logoIcon" src="./assets/logo.png" alt="logo" class="w-20 mb-[40px]" />

        <!-- Menu -->
        <div class=" gap-8 text-lg flex text-transparent md:text-white mb-[40px]">
          <a href="#">Home</a>
          <a href="#">Portfolio</a>
          <a href="#">Skills</a>
          <a href="#">About Me</a>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-5">
          <div
            id="themeToggle"
            class="w-14 h-8 bg-[#FFEC70] rounded-full flex items-center gap-1 px-1 cursor-pointer theme-toggle mb-[40px]"
          >
            <div id="toggleCircle" class="w-6 h-6 bg-[#FFFDED] rounded-full theme-toggle-circle"></div>
            <img id="toggleIcon" src="assets/moon-toggle.png" alt="moon" class="w-5" />
          </div>

          <!-- Hamburger Menu Button (Mobile Only) -->
          <button id="hamburgerBtn" class="flex flex-col gap-1 cursor-pointer md:hidden mb-[40px]">
            <span class="w-6 h-0.5 bg-white block"></span>
            <span class="w-6 h-0.5 bg-white block"></span>
            <span class="w-6 h-0.5 bg-white block"></span>
          </button>

          <!-- Contact Button (MD and LG only) -->
          <button class="bg-[#925FF0] px-6 py-2 rounded hidden mb-[40px] md:block">Contact Me</button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu" class="hidden fixed top-20 right-0 bg-black border-l border-[#925FF0] w-64 h-screen z-50">
          <div class="flex flex-col gap-6 p-8 text-lg">
            <a href="#" class="hover:text-[#925FF0] transition">Home</a>
            <a href="#" class="hover:text-[#925FF0] transition">Portfolio</a>
            <a href="#" class="hover:text-[#925FF0] transition">Skills</a>
            <a href="#" class="hover:text-[#925FF0] transition">About Me</a>
          </div>
        </div>
      </nav>

      <!-- HERO SECTION -->
      <section class="flex flex-1 items-center mb-3 lg:mb-0 mx-auto lg:mx-0 px-10 gap-10">
        <!-- LEFT CONTENT -->
        <div class="flex flex-col gap-12 flex-1">
          <div>
            <h1 class="font-anton text-[140px] leading-[0.9]">
              PRODUCT<br />DESIGNER
            </h1>

            <h2 class="font-anton text-[80px] text-gradient whitespace-nowrap">CRISTIAN MUÑOZ</h2>
          </div>

          <!-- SOCIALS -->
          <div class="flex w-full max-w-[490px] justify-between">
            <img id="instagramIcon" src="./assets/instagram.png" class="w-15" />
            <img id="figmaIcon" src="./assets/figma.png" class="w-15" />
            <img id="linkedinIcon" src="./assets/linkedin.png" class="w-15" />
            <img id="twitterIcon" src="./assets/twitter.png" class="w-15" />
            <img id="telegramIcon" src="./assets/telegram.png" class="w-15" />
            <img id="socialIcon" src="assets/social-networks.png" class="w-15" />
          </div>

          <!-- BUTTON -->
          <button
            class="bg-[#292929] px-8 py-4 w-full max-w-[490px] justify-center flex items-center gap-3"
          >
            Download Curriculum Vitae
            <img src="./assets/right-circle.png" class="w-5" />
          </button>
        </div>

        <!-- STAR SEPARATOR -->
        <div class="absolute hidden lg:block left-[42%] top-[27%]">
          <img
            id="starIcon"
            src="./assets/star.png"
            alt="star"
            class="w-24"
          />
        </div>

        <!-- RIGHT IMAGE -->
        <div class="flex-1 h-full hidden lg:block mb-5 flex items-center">
          <img
            id="heroImage"
            src="./assets/right-img.png"
            class="w-full h-[600px] object-cover rounded-lg"
          />
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
